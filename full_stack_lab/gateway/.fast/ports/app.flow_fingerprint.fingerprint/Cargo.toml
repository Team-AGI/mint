# Rust port of app.flow_fingerprint.fingerprint, generated by fast-anything.
[package]
name = "fa_app_flow_fingerprint_fingerprint"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "fa_app_flow_fingerprint_fingerprint"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
blake2b_simd = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# A crate of its own, even inside another Cargo workspace.
[workspace]
